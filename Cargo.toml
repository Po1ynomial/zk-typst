[package]
name = "zk"
version = "0.2.0"
edition = "2024"
include = [
  "Cargo.lock",
  "Cargo.toml",
  "docs/**",
  "skills/**",
  "src/**",
  "tests/**",
]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.47", features = ["derive"] }
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-std", "rt-multi-thread", "sync"] }
toml = "0.9.5"
tower-lsp = "0.20.0"
typst-syntax = "=0.15.1"

[dev-dependencies]
assert_cmd = "2.0.17"
tempfile = "3.21.0"

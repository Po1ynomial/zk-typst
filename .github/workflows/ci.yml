name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1.58.0
          fallback: none

      - name: Install Markdown linter
        env:
          RUMDL_VERSION: 0.2.78
          RUMDL_TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          archive="rumdl-v${RUMDL_VERSION}-${RUMDL_TARGET}.tar.gz"
          base="https://github.com/rvben/rumdl/releases/download/v${RUMDL_VERSION}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSLo "$tmp/$archive" "$base/$archive"
          curl -fsSLo "$tmp/$archive.sha256" "$base/$archive.sha256"
          (cd "$tmp" && sha256sum -c "$archive.sha256")
          sudo tar -xzf "$tmp/$archive" -C /usr/local/bin rumdl
          rumdl --version

      - name: Run repository checks
        run: just check
